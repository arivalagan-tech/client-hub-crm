<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Client Hub CRM - A premium recruiter-ready SaaS Client Relationship Management dashboard to track notes, calls, and business opportunities." />
  <title>Client Hub CRM - Dashboard</title>
  <link rel="icon" href="assets/images/user.png">
  
  <!-- Premium External Stylesheet Modules -->
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <!-- Semantic Header and Premium Navbar -->
  <header class="navbar">
    <div class="navbar-left">
      <img src="assets/images/icons8-workflow-50.png" alt="Client Hub Workflow Icon" height="30" width="30">
      <span class="brand-name">Client Hub</span>
    </div>
    <nav class="navbar-right" aria-label="Main Navigation">
      <ul class="nav-links">
        <li><a href="index.html" class="active">Add Client</a></li>
        <li><a href="clients.html">Clients</a></li>
      </ul>
      <img src="assets/images/client profile.png" class="avatar-img" alt="User Profile Image">
    </nav>
  </header>

  <!-- Main Landmark containing the Add Client Form -->
  <main class="form-container">
    <h2>Add New Client</h2>
    <form name="addNewClient" class="client-form" novalidate>
      <label for="name">Client Name</label>
      <input type="text" name="fullName" id="name" placeholder="Enter client's full name" required aria-required="true" />
      
      <label for="tag">Client Tag</label>
      <select name="clientTag" id="tag" class="form-select" aria-label="Select Client Tag Category">
        <option value="Select">Select Tag</option>
        <option value="Elite">Elite</option>
        <option value="Premium">Premium</option>
        <option value="Deluxe">Deluxe</option>
        <option value="Basic">Basic</option>
      </select>
      
      <label for="Status">Client Status</label>
      <select name="clientStatus" id="Status" class="form-select" aria-label="Select Active Client Status">
        <option value="Select">Select Status</option>
        <option value="Available">Available</option>
        <option value="Busy">Busy</option>
        <option value="Inactive">Inactive</option>
      </select>
      
      <label for="spent-time">Spent Time</label>
      <input type="text" id="spent-time" name="spent-time" placeholder="e.g: 5 hours">
      
      <label for="company">Company</label>
      <input name="Company" type="text" id="company" placeholder="Enter client's company name" required aria-required="true" />
      
      <label for="address">Address</label>
      <textarea id="address" name="address" rows="3" placeholder="Enter client's address"></textarea>
      
      <label for="email">Email</label>
      <input name="email" type="email" id="email" placeholder="Enter client's email address" required aria-required="true" />
      
      <label for="phone">Phone Number</label>
      <input name="phoneNumber" type="text" id="phone" placeholder="Enter client's phone number" required aria-required="true" />
      
      <label for="available-time">Available Time</label>
      <input type="text" id="available-time" name="available-time" placeholder="e.g: Weekdays, 9 AM - 5 PM">
      
      <label for="Language">Preferred Language</label>
      <select name="preferredLanguage" id="Language" class="form-select" aria-label="Select Preferred Communication Language">
        <option value="Select">Select Language</option>
        <option value="English">English</option>
        <option value="Tamil">Tamil</option>
        <option value="Malayalam">Malayalam</option>
        <option value="Kannada">Kannada</option>
        <option value="Hindi">Hindi</option>
        <option value="Telugu">Telugu</option>
      </select>
      
      <!-- Scheduled Interaction Grid -->
      <div class="date-time-container-main">
        <label>Next Call Setup (Optional)</label>
        <div class="date-time-container">
          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" name="date">
          </div>
          <div class="field">
            <label for="time">Time</label>
            <input type="time" id="time" name="time">
          </div>
          <div class="field">
            <label for="agenda">Agenda</label>
            <textarea name="call-agenda" id="agenda" rows="2" placeholder="Purpose of Next-Call"></textarea>
          </div>
        </div>
      </div>
      
      <label for="notes">Initial Meeting Notes</label>
      <textarea name="new-notes" id="notes" rows="4" placeholder="Enter initial meeting feedback..." required aria-required="true"></textarea>
      
      <button type="submit" class="save-btn">Save Client</button>
    </form>
  </main>

  <!-- Load Module Scripts -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
